fastp:
  qualified_quality_phred: 15
  unqualified_percent_limit: 40
  average_quality: 0
  length_limit: 0
unicycler:
  mode: "normal"
amrfinder:
  organism: ""
  coverage_min: 0.5
  ident_min: -1
bakta:
  database: "data/baktadb" # Path to Bakta database. Default: data/baktadb_full or data/baktadb_light (if downloaded via migex download_db --bakta). Specify full path if using custom location.
abricate:
  virulence:
    database: "vfdb"      # virulence factor database
    minCoverage: 80       # minimum coverage %
    minIdentity: 80       # minimum identity %
  plasmids:
    database: "plasmidfinder"
    minCoverage: 90
    minIdentity: 90
mlst:
  species: ""  # Leave blank for auto-detection, or specify e.g., "Escherichia coli"