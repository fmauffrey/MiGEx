reference_genome:
  id: ""
  size: ""
fastp:
  qualified_quality_phred: 15
  unqualified_percent_limit: 40
  average_quality: 0
  length_limit: 0
unicycler:
  mode: "normal"
amrfinder:
  organism: ""        # Organism for AMRFinder. Leave blank for auto-detection.
  coverage_min: 0.5
  ident_min: -1
bakta:
  database: "" # Path to Bakta database.
abricate:
  virulence:
    database: "vfdb"      # virulence factor database
    minCoverage: 80       # minimum coverage %
    minIdentity: 80       # minimum identity %
  plasmids:
    database: "plasmidfinder"
    minCoverage: 90
    minIdentity: 90
mlst:
  organism: ""  # Leave blank for auto-detection
samtools:
  min_quality: 30          # Minimum mapping quality for samtools